# Settings Cold Weenie needs over RetroArch 1.22.2 defaults. tools/setup_retroarch.sh applies this.
systemfiles_in_content_dir = "true"
savefile_directory = "/storage/emulated/0/RetroArch/saves"
savestate_directory = "/storage/emulated/0/RetroArch/states"
network_cmd_enable = "false"
network_cmd_port = "55355"
quit_press_twice = "false"
autosave_interval = "60"
menu_driver = "ozone"
video_driver = "gl"
video_threaded = "false"
video_fullscreen = "true"
audio_latency = "64"
audio_sync = "true"
video_smooth = "false"
video_font_enable = "false"
input_quit_gamepad_combo = "4"
input_menu_toggle_gamepad_combo = "2"
pause_nonactive = "true"
config_save_on_exit = "false"
log_verbosity = "false"
frontend_log_level = "0"
libretro_log_level = "1"
log_to_file = "false"
log_dir = "/storage/emulated/0/RetroArch/logs"
sort_savefiles_enable = "false"
sort_savefiles_by_content_enable = "false"
sort_savestates_enable = "false"
sort_savestates_by_content_enable = "false"
sort_screenshots_by_content_enable = "false"
savestate_auto_save = "true"
savestate_auto_load = "true"
savestate_thumbnail_enable = "true"
